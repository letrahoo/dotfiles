# ==============================================================================
# Tmux Configuration — Everforest Dark (Custom Highlight Edition)
# ==============================================================================

# 1. TrueColor (24-bit RGB) & Terminal Capabilities
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",*:hyperlinks"
set -g allow-passthrough on
set -ga terminal-overrides ",*256col*:Tc"

# 2. Ergonomics & Mouse
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
setw -g mode-keys vi

# Intuitive splits preserving current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 3. Everforest Dark Visual Theme (#2d353b bg, #e6c384 warm gold, #83c995 forest green)
set -g status-position bottom
set -g status-style "bg=#343f44,fg=#d8caac"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#a7c080,fg=#2d353b,bold] #S #[bg=#343f44,fg=#a7c080] "
set -g status-right "#[fg=#859289]%Y-%m-%d %H:%M #[bg=#3d484d,fg=#83c995] #H "

setw -g window-status-format "#[fg=#859289] #I:#W "
setw -g window-status-current-format "#[bg=#3d484d,fg=#e6c384,bold] #I:#W* "
setw -g window-status-separator ""

set -g pane-border-style "fg=#475258"
set -g pane-active-border-style "fg=#83c995"
set -g message-style "bg=#3d484d,fg=#e6c384,bold"
setw -g mode-style "bg=#3d484d,fg=#e6c384"
